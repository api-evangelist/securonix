        '200':
          description: Policy fetched successfully
          headers:
            X-Response-Format-Fallback:
              description: Indicates that the response format was changed from the requested format. Value is 'json' when YAML conversion fails and falls back to JSON.
              schema:
                type: string
                example: json
            X-Response-Format-Requested:
              description: Indicates the originally requested response format.
              schema:
                type: string
                example: yaml
            X-Yaml-Conversion-Fallback-Reason:
              description: Indicates the specific reason for YAML to JSON fallback. Value is 'missing-mandatory-fields' when the columns parameter is missing required fields for YAML conversion. Only present when X-Response-Format-Fallback is 'json'.
              schema:
                type: string
                example: missing-mandatory-fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePolicyResponse'
