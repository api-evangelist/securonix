- name: Threat intelligence (ThreatQ)
  spec: openapi/securonix-threatq-api.json
  root_entities: [indicators, adversaries, events, malware, campaign, incident, investigations,
                  signatures, attack_pattern, course_of_action, exploit_target, identity,
                  infrastructure, intrusion_set, report, tool, ttp, vulnerability, asset, tasks]
  polymorphic_pattern:
    template: /{object_type}/{object_type_id}/...
    sub_collections: [attributes, comments, sources, tags, watchlist]
    relationship_edge: /{src_object_collection}/{src_object_id}/{dest_object_collection}/{object_link_id}
    note: >-
      ThreatQ models every intelligence object through one polymorphic template. Any object type
      can carry attributes, comments, sources, tags and watchlist entries, and any two objects can
      be linked by an object_link, with attributes and comments hanging off the link itself. That
      is the whole ER graph in one shape — it is why the spec reaches 209 operations over 200
      schemas without a per-type explosion of paths.
  cross_cutting:
  - name: TLP
    detail: >-
      Traffic Light Protocol is a first-class object (/tlp) referenced by tlp_id on intelligence
      objects, so handling caveats travel with the record.
