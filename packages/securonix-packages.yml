  unrelated package, `onyx-lib`). The Developer Guide's own recommendation is to call the REST
  APIs from a generic tool — "You can develop and test REST APIs in any API development tool such
  as Postman, Swagger, or SOAP UI" — rather than from a vendor library. No `SDKs` pointer is
  emitted, because there is no SDK.
