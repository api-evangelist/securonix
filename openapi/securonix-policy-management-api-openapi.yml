          expiry_date_from_current_time: true
    RemovalPeriod:
      type: object
      properties:
        days:
          type: integer
          description: Number of days
          minimum: 0
          maximum: 365
        time:
          type: string
          description: Time in HH:mm:ss format
          pattern: ^([01]\d|2[0-3]):([0-5]\d):([0-5]\d)$
        expiry_date_from_current_time:
          type: boolean
          description: Calculate expiry from current time
          default: false
      required:
