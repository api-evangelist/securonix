    /groups/{group_id}) with no urn:ietf:params:scim:schemas:* URN anywhere in the docs or specs.
- id: saml
  conforms: true
  evidence: >-
    SAML single sign-on is a documented, configurable platform setting
    (https://documentation.securonix.com/r/content/settings-saml-settings.htm and
