                    - label_name: scx.attack.privilege_escalation
                      labelId: 245
                      idx: 1
                    policyWatchlists:
                    - id: 10
                      watchlistId: 9995
                      index: 0
                      watchlistName: Recent_Transfers
                      expiryDaysCount: 30
                      decayFactor: 0
                      decayFlag: false
