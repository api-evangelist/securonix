          description: Verbose information template. Provides summary of the violation.
        apisource:
          type: string
          description: Identifies the system calling the API to create or update a policy. Must not be 'PA'.
          maxLength: 2
          default: PA
      examples:
      - tenantnames:
        - tenantB
        description: Updating policy description
        labels:
        - updated.label.name
        detection:
          selection_1:
            baseeventid: 4688
          selection_2:
            destinationprocessname: lsaas.exe
          selection_3:
            commandline|contains: lsass.exe
          condition: selection_1 AND ( selection_2 or selection_3 )
        saveasthreat: true
        incident_workflow: SOCTeamReview
        autoIncidentEnabled: true
        violatorAttribute: sourceusername
        additional_event_analytics:
          match_all_checks: true
          check_against_watchlist:
          - accountname: Terminated_Contractors
            flag_violation_not_found_in_watchlist: true
          check_against_lookup:
          - lookup:
              accountname: MultipleFailedEntries
            condition: lookup
            additional_criteria:
              selection_1:
                VendorId|contains: Vendor
              condition: NOT selection_1
          email_to_self:
          - emailrecipient: 0.8
          match_string:
          - ms:
              first_field: AccountName
              second_field: UserNameSpace
              threshold: 0.8
          check_against_tpi:
          - tpi: null
            destinationaddress:
            - SNXTIS_BASIC_IPV4
            - SNXTIS_BASIC_IPV6
            additional_criteria:
              selection_1:
              - tpi_src_confidence|gt: 5
              - tpi_country|contains|attr: country
              selection_2:
              - tpi_src: abc
              condition: selection_1 AND NOT selection_2
          check_against_activelist:
          - activelist:
              rule: ipaddress
              rule_match_present: true
              activelist_name: Password_spraying_attempts_From_single_IP
        analytic_type:
          aggregated_event_analytics:
          - name: Authentication Failed
            aee_filter:
              selection1:
                baseeventid: 4625
              condition: selection1
            number_of_occurrences:
              duration: 01:30:00
              atleast: 1
              count_matching_criteria:
                baseeventid: 15
            similar_value:
            - accountname
            consecutive_events: true
            distinct_value:
            - ipaddress
            - eventcountry
          - name: Authentication Success
            aee_filter:
              selection1:
                baseeventid|equals: 4625
              condition: selection1
            number_of_occurrences:
              duration: 01:30:00
              atleast: 1
              count_matching_criteria:
                baseeventid: 15
            consecutive_events: false
            distinct_value:
            - ipaddress
            - eventcountry
            parent_child_relationship:
              duration: 01:00:00
              common_values:
              - accountname
        verbose_info: '''Account ${accountname!"UNKNOWN"} getting updates from possible suspicious IP Address.'''
        apisource: AI
