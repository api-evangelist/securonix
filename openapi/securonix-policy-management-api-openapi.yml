    Policy:
      type: object
      title: Policy
      description: 'Data model for policy information. It is defined in yaml format following the Securonix DELTA framework.



        Refer [DELTA framework](../user-guide/developer-guide/Securonix-delta-framework) for more information.'
      properties:
        name:
          type: string
          description: Policy name.
          minLength: 3
          maxLength: 255
        id:
          type: integer
          description: Policy unique identifier.
          format: int64
        category:
          type: array
          description: Policy categories. Violations of the policy will belong to these categories
          uniqueItems: true
          items:
            type: string
        category_copy:
          type: array
          description: Policy categories. Violations of the policy will belong to these categories
          uniqueItems: true
          items:
            type: string
        functionality:
          type: array
          description: Policy functionality. It helps identify the core purpose or domain the policy belongs to.
          uniqueItems: true
          items:
            type: string
        lifecycle:
          type: string
          description: Policy lifecycle stage.
        version:
          type: number
          description: Sec Version of the policy.
          format: double
        description:
          type: string
          description: Policy description.
          maxLength: 1000
        labels:
          type: array
          description: Policy labels/tags.
          items:
            type: string
            examples:
            - attack.defense_evasion
        logsource:
          $ref: '#/components/schemas/LogSource'
        detection:
          $ref: '#/components/schemas/detection'
          description: "Detection logic and conditions. Used to detect violations based on one or more selection blocks, filter and a condition.\n\n**Structure:**\n- Must contain **at least one** selection key (`selection_n`, where n ≥ 1)  \n- Can contain an optional `filter` for further filtering\n- Must contain a `condition` key  \n**Selection configuration**  \n  Defines field-level conditions used for filtering.\n\n**General format:**\n\nfieldName[|modifier][|attr|oex]: value\n\n\n**Formats**\n- *Literal-based comparison*  \n  ```\n  fieldName[|modifier]: value\n  ```\n- *Attribute-based comparison*  \n  ```\n  fieldName[|modifier]|attr: securonix_attribute\n  ```\n- *External operator expression comparison* \n  - *Supported operators*  \n    1. `whitelist_ip`  \n    2. `whitelist_domain`  \n\n  ```\n  fieldName[|modifier]|oex: operator(attr_or_value)\n  ```\n- *Check against named list comparison*  \n  ```\n  fieldName[|list_modifier]: lookup_table\n  ```\n\n**Parameters**\n- **fieldName** — event field name to evaluate\n- **modifier** *(optional)* — comparison operator (defaults to `equals`)\n- **attr** *(optional)* — references another attribute value\n- **oex** *(optional)* — external operator invocation for lookups (e.g., whitelist checks)\n- **value** — literal value, attribute reference, function call, or lookup table\n\n**Supported modifiers**\n- equals *(default if omitted)*\n- contains\n- gt (greater than)\n- gte (greater than or equal)\n- lt (less than)\n- lte (less than or equal)\n- startswith\n- endswith\n- isnull\n- regex (regex pattern match)\n\n**Negation modifiers**\n- not equals\n- not contains\n- is not null\n- not regex\n\n**List modifiers**\n- equalsinlist *(default if omitted)*\n- containsinlist\n- startswithinlist\n- endswithinlist\n- cidrinlist (CIDR range match, restricted to IP attributes: ipaddress, sourceaddress, destinationaddress, deviceaddress, translatedipaddress)\n- regexinlist (regex pattern match against lookup table)\n\n**Negation list modifiers**\n- not equalsinlist\n- not containsinlist\n- not startswithinlist\n- not endswithinlist\n- not cidrinlist\n- not regexinlist\n\n**Negation usage**\n- Apply negation to a selection block by prefixing its reference with `NOT` in `condition`.\n- Example:\n  ```yaml\n  selection_1:\n    emailsender|equals: sender\n  condition: NOT selection_1\n  ```\n  Evaluates as:\n  ```\n  emailsender(NOT_EQUALS)sender\n  ```\n\n**Examples of supported selection forms**\n\n1. Attribute-based comparison\n   ```yaml\n   emailsender|contains|attr: securonix_attribute\n   ```\n   → emailsender(CONTAINS)attr.securonix_attribute\n\n2. External operator expression with attribute\n   ```yaml\n   requesturl|contains|oex: whitelist_domain(attr.destinationhostname)\n   ```\n   → requesturl(CONTAINS)whitelist_domain(attr.destinationhostname)\n\n3. External operator expression with literal\n   ```yaml\n   requesturl|equals|oex: whitelist_ip(\"10.0.10.0\")\n   ```\n   → requesturl(EQUALS)whitelist_ip(\"10.0.10.0\")\n\n4. Check against lookup table\n   ```yaml\n   accountname|equalsinlist: lookup_table\n   ```\n   → accountname(EQUALS_IN_LIST)lookup_table\n\n5. Literal-based with default modifier\n   ```yaml\n   accountname: value\n   ```\n   → accountname(EQUALS)value\n\n6. Literal-based with explicit modifier\n   ```yaml\n   accountname|contains: value\n   ```\n   → accountname(CONTAINS)value\n\n7. Literal-based with negation\n   ```yaml\n   selection_1:\n     accountname|contains: value\n   condition: NOT selection_1\n   ```\n   → accountname(NOT_CONTAINS)value\n\n8. Attribute-based with negation\n   ```yaml\n   selection_1:\n     accountname|contains|attr: securonix_attribute\n   condition: NOT selection_1\n   ```\n   → accountname(NOT_CONTAINS)attr.securonix_attribute\n\n9. Check against lookup with negation\n   ```yaml\n   selection_1:\n     accountname|containsinlist: value\n   condition: NOT selection_1\n   ```\n   → accountname(NOT_CONTAINS_IN_LIST)value\n\n10. External operator expression with negation\n    ```yaml\n    selection_1:\n      accountname|contains|oex: whitelist_domain(\"abc.com\")\n    condition: NOT selection_1\n    ```\n    → accountname(NOT_CONTAINS)whitelist_domain(\"abc.com\")\n\n11. CIDR range match against lookup table\n    ```yaml\n    selection_1:\n      ipaddress|cidrinlist: SCNX_PrivateIPCIDRs\n    condition: selection_1\n    ```\n    → ipaddress(EQUALS_IN_CIDR_RANGE_LIST)SCNX_PrivateIPCIDRs\n\n12. CIDR range match with negation\n    ```yaml\n    selection_1:\n      ipaddress|cidrinlist: SCNX_PrivateIPCIDRs\n    condition: NOT selection_1\n    ```\n    → ipaddress(NOT_EQUALS_IN_CIDR_RANGE_LIST)SCNX_PrivateIPCIDRs\n\n13. Regex pattern match\n    ```yaml\n    selection_1:\n      accountname|regex: ^admin.*$\n    condition: selection_1\n    ```\n    → accountname(REGEX_EQUALS)^admin.*$\n\n14. Regex pattern match with negation\n    ```yaml\n    selection_1:\n      accountname|regex: ^admin.*$\n    condition: NOT selection_1\n    ```\n    → accountname(REGEX_NOT_EQUALS)^admin.*$\n\n15. Regex match against lookup table\n    ```yaml\n    selection_1:\n      accountname|regexinlist: RegexPatternLookup\n    condition: selection_1\n    ```\n    → accountname(REGEX_EQUALS_IN_LIST)RegexPatternLookup\n\n16. Regex match against lookup table with negation\n    ```yaml\n    selection_1:\n      accountname|regexinlist: RegexPatternLookup\n    condition: NOT selection_1\n    ```\n    → accountname(REGEX_NOT_EQUALS_IN_LIST)RegexPatternLookup\n"
        criticality:
          type: string
          description: Policy criticality level.
          pattern: ^(None|Low|Medium|High)$
        violator:
          type: string
          description: Violator type.
