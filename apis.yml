aid: securonix
name: Securonix
description: Securonix is a cybersecurity company whose Unified Defense SIEM platform combines security
  information and event management, user and entity behavior analytics (UEBA), security orchestration
  automation and response (SOAR), and — following the June 2025 acquisition of ThreatQuotient — the ThreatQ
  threat intelligence platform. The platform ingests activity data from hundreds of connectors, applies
  behavior analytics and MITRE ATT&CK-aligned detection policies, and drives incident workflows for security
  operations teams. Securonix publishes a Developer Guide covering token-based web services, a Spotter
  search API, and four OpenAPI 3.x definitions on SwaggerHub for Policy Management, Datasource Onboarding,
  Device Monitoring and ThreatQ.
