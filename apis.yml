apis:
- name: Securonix Policy Management API
  description: Create, update, enable/disable, delete and fetch Securonix Unified Defense SIEM detection
    policies, plus MITRE ATT&CK threat-coverage metrics and technique details. OpenAPI 3.1.0, 10 operations,
    JWT bearer authentication against a regional Policy Management base URL.
  humanURL: https://documentation.securonix.com/r/content/policy-management-api.htm
  baseURL: https://policymanagement.api.securonix.net
  tags:
  - Policies
  - Detection
  - MITRE ATT&CK
  properties:
  - type: OpenAPI
    url: openapi/securonix-policy-management-api.json
  - type: APIReference
    url: https://app.swaggerhub.com/apis-docs/securonix-b7a/Securonix_Policy_Management_API/3.1.4
  - type: Documentation
    url: https://documentation.securonix.com/r/content/policy-management-api.htm
  - type: Overlay
    url: overlays/securonix-policy-management-api-overlay.yaml
- name: Securonix Datasource Onboarding API
  description: Configure API-based and Syslog-based data sources, syslog sources and filters, resource
    groups, parser (CRP) content and activity-import job summaries for Securonix Unified Defense SIEM.
    OpenAPI 3.0.3, 22 operations, wstoken header authentication.
  humanURL: https://documentation.securonix.com/r/content/datasource-api.htm
  baseURL: https://{tenantId}.securonix.net/Snypr
  tags:
  - Data Ingestion
  - Connectors
  - Syslog
  properties:
  - type: OpenAPI
    url: openapi/securonix-datasource-onboarding-api.json
  - type: APIReference
    url: https://app.swaggerhub.com/apis-docs/securonix-b7a/Datasource_Onboarding/1.0.0
  - type: Documentation
    url: https://documentation.securonix.com/r/content/datasource-api.htm
  - type: Overlay
    url: overlays/securonix-datasource-onboarding-api-overlay.yaml
- name: Securonix Device Monitoring API
  description: List monitored devices and their metadata from Securonix Unified Defense SIEM. OpenAPI
    3.0.3, one operation, token header authentication against the tenant SNYPR web-services host.
  humanURL: https://documentation.securonix.com/r/content/device-monitoring-api.htm
  baseURL: https://{tenantId}.securonix.net/Snypr/ws
  tags:
  - Device Monitoring
  - Observability
  properties:
  - type: OpenAPI
    url: openapi/securonix-device-monitoring-api.json
  - type: APIReference
    url: https://app.swaggerhub.com/apis-docs/securonix-b7a/Device_Monitoring/1.0.0
  - type: Documentation
    url: https://documentation.securonix.com/r/content/device-monitoring-api.htm
  - type: Overlay
    url: overlays/securonix-device-monitoring-api-overlay.yaml
- name: Securonix ThreatQ API
  description: The ThreatQ threat intelligence platform API — adversaries, indicators, events, assets,
    attributes, signatures, TLP, scoring, exports and integrations. OpenAPI 3.0.0, 209 operations, OAuth2
    password grant issuing a bearer access token. ThreatQuotient was acquired by Securonix in June 2025
    and ThreatQ is sold as a Securonix product; the spec is linked from Securonix's own Developer Guide.
  humanURL: https://documentation.securonix.com/r/content/threat-q-api.htm
  baseURL: https://threatq.com/api
  tags:
  - Threat Intelligence
  - Indicators
  - STIX
  properties:
  - type: OpenAPI
    url: openapi/securonix-threatq-api.json
  - type: APIReference
    url: https://app.swaggerhub.com/apis-docs/securonix-b7a/ThreatQ/1.0.0
  - type: Documentation
    url: https://documentation.securonix.com/r/content/threat-q-api.htm
  - type: Overlay
    url: overlays/securonix-threatq-api-overlay.yaml
- name: Securonix Web Services (SNYPR REST API)
  description: The documented SNYPR / Unified Defense SIEM web-service surface reached at /ws on the tenant
    host — token generation and validation, incident management and actions, activity, asset, geolocation,
    list, lookup, data dictionary, risk history, Security Command Center widgets, third-party intel, TopN,
    users, violations, watchlist and whitelist categories. Documented in the Developer Guide; no OpenAPI
    is published for this surface.
  humanURL: https://documentation.securonix.com/r/content/rest-api-categories.htm
  baseURL: https://{tenantId}.securonix.net/Snypr/ws
  tags:
  - Incidents
  - Web Services
  - Watchlist
  properties:
  - type: Documentation
    url: https://documentation.securonix.com/r/content/rest-api-categories.htm
  - type: Authentication
    url: https://documentation.securonix.com/r/content/authentication.htm
- name: Securonix Spotter API
  description: Asynchronous search microservice over the Securonix data lake — trigger a Spotter or SQL
    query, poll its execution status, page results, and cancel a running query. Bearer JWT via the snypr-service-gateway.
    Documented in the Developer Guide; no OpenAPI is published.
  humanURL: https://documentation.securonix.com/r/content/spotter-api.htm
  baseURL: https://{snypr_service_gateway_url}/shared/snypr-service-gateway/spotter-api/spotter/api/v1
  tags:
  - Search
  - Query
  - Analytics
  properties:
  - type: Documentation
    url: https://documentation.securonix.com/r/content/spotter-api.htm
