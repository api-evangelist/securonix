    AdditionalCriteria:
      type: object
      description: "Additional criteria configuration.\n\n**Requirements:**\n- Must contain **at least one** selection key (`selection_n`, where n ≥ 1)\n- Must contain **one** `condition` key.\n\n**Accepted keys:**\n- `selection_n`: Numbered selection blocks (e.g., `selection_1`, `selection_2`, …)\n- `condition`: Defines the condition to apply\n\n**Selection value types:**\n1. **List of entries** → conditions are joined with **OR**  \n2. **Map of entries** → conditions are joined with **AND**  \n\n---\nThe `|attr`, `|gt`, etc. are operator suffixes.  \nThe left-hand side is the field name, the right-hand side is the comparison value."
      properties:
        condition:
          type: string
          description: Logical condition referencing one or more selections.
      patternProperties:
        ^selection_[0-9]*$:
          oneOf:
          - type: array
            items: {}
          - type: object
          description: Criteria for a selection, where `n` is a positive integer.
      required:
      - condition
      minProperties: 2
      examples:
      - selection_1:
          VendorId|contains: Vendor
        condition: NOT selection_1
