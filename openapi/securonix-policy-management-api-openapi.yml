    AggregatedEventAnalyticsDelta:
      type: object
      description: 'Defines an Aggregated Event Analytics (AEE) directive.


        - **Parent directive**: Base aggregation detection logic.

        - **Parent-Child directive**: Additional logic to group violations to a Parent directive.


        Most fields apply to both Parent and Child. Fields marked as *Parent-only* or *Child-only* apply only in those contexts.'
      properties:
        name:
          type: string
          description: name of the directive.
        aee_filter:
          type: object
          description: "AEE filter configuration.\n\nUsed to filter results based on one or more selection blocks and a condition.\n\n**Structure:**\n- Must contain **at least one** selection key (`selection_n`, where n ≥ 1)  \n- Must contain a `condition` key  \n- Selection keys may contain **either**:\n  * A **list** of entries → conditions are joined with **OR**.\n    Example:\n    ```yaml\n    selection_1:\n      - deviceeventcategory: malicious\n      - destinationhostname|contains: pwned\n    ```\n    Evaluates as:\n    ```scss\n    deviceeventcategory(equals)malicious OR destinationhostname(contains)pwned\n    ```\n  * A **map** of entries → conditions are joined with **AND**\n    Example:\n    ```yaml\n    selection_1:\n      deviceeventcategory: malicious\n      destinationhostname|contains: pwned\n    ```\n    Evaluates as:\n    ```scss\n    deviceeventcategory(equals)malicious AND destinationhostname(contains)pwned\n    ```\n**Entry format:**\nfield[|modifier]: value\n\n- **field** — the name of the field to filter on.  \n- **modifier** *(optional)* — comparison/matching operation. Defaults to `equals` if omitted.\n\n**Supported modifiers:**\n1. `equals` *(default if omitted)*\n2. `contains`\n3. `gt` — greater than\n4. `gte` — greater than or equal\n5. `lt` — less than\n6. `lte` — less than or equal\n7. `startswith`\n8. `endswith`\n9. `isnull`\n\n**Negation modifiers:**\n1. `not equals`\n2. `not contains`\n3. `is not null`\n\n**Negation usage:**  \nTo apply negation to an entire selection block, prefix the selection key with `NOT` in `condition`.  \nExample:\n```yaml\nselection_1:\n  deviceeventcategory|contains: malicious\ncondition: NOT selection_1\n```\nEvaluates as:\n```scss\ndeviceeventcategory(not_contains)malicious\n```\n\nAccepted examples:\n\n- Selection with default `modifier`\n  ```yaml\n  selection_1:\n    deviceeventcategory: \"allowed\"\n  ```\n  Evaluates as:\n  ```scss\n  deviceeventcategory(EQUALS)\"allowed\"\n  ```\n- Selection with `modifier`\n  ```yaml\n  selection_1:\n    deviceeventcategory|contains: \"allowed\"\n  ```\n  Evaluates as:\n  ```scss\n  deviceeventcategory(CONTAINS)\"allowed\"\n  ```\n- Selection with negation `modifier` \n  ```yaml\n  selection_1:\n    deviceeventcategory|contains: \"allowed\"\n  condition: NOT selection_1\n  ```   \n  Evaluates as:\n  ```scss\n  deviceeventcategory(NOT_CONTAINS)\"allowed\"\n  ```\n\n"
          properties:
            condition:
              type: string
              description: Logical condition referencing one or more selections.
          patternProperties:
            ^selection_[1-9][0-9]*$:
              oneOf:
              - type: array
                items: {}
              - type: object
              description: Criteria for a selection, where `n` is a positive integer.
          required:
          - condition
        number_of_occurrences:
          $ref: '#/components/schemas/FrequencyBasedThreshold'
        amount_of_data:
          $ref: '#/components/schemas/AmountBasedThreshold'
        similar_value:
          type: array
          description: '*Parent-only*: Events will have same attribute value.'
          uniqueItems: true
          items:
            type: string
        consecutive_events:
          type: boolean
          description: Should events happen consecutively
        distinct_value:
          type: array
          description: Distinct attribute selected value
          uniqueItems: true
          items:
            type: string
        parent_child_relationship:
          $ref: '#/components/schemas/ParentChildRelation'
      required:
      - name
      x-internal: true
