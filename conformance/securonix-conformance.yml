domain_standards:
- id: mitre-attack
  name: MITRE ATT&CK
  conforms: true
  declared_in_contract: true
  evidence: >-
    The Policy Management API declares MITRE ATT&CK directly in the contract, not only in
    marketing prose: GET /v1/policies/threat-coverage/metrics ("Get MITRE ATT&CK threat coverage
    metrics", tag "Threat Coverage") returns tactics/techniques/sub-techniques with coverage
    status, and its CSV projection is a flat TacticID, TacticName, TechniqueID, TechniqueName,
    SubtechniqueID, SubtechniqueName, CoverageStatus row shape; GET
    /v1/policies/threat-coverage/technique-details returns technique detail. A consumer that
    already speaks ATT&CK technique IDs integrates with no bespoke mapping layer.
  spec_location: openapi/securonix-policy-management-api.json#/paths/~1v1~1policies~1threat-coverage~1metrics
- id: tlp
  name: FIRST Traffic Light Protocol
  conforms: true
  declared_in_contract: true
  evidence: >-
    The ThreatQ API models TLP as a first-class resource and attribute across the contract —
    76 occurrences including /tlp collection endpoints and tlp_id fields on indicators,
    adversaries, events and attributes — so intelligence-sharing handling caveats travel with
    the object rather than needing a bilateral convention.
  spec_location: openapi/securonix-threatq-api.json
- id: stix-taxii
  name: STIX / TAXII 2.1
  conforms: partial
  declared_in_contract: false
  evidence: >-
    Securonix documents a STIX/TAXII 2.1 third-party-intelligence connector
    (https://documentation.securonix.com/r/content/active-deployment-guides/stix-taxi.htm) for
    ingesting threat intelligence, and the ThreatQ spec references STIX/TAXII once. This is an
    ingest-side integration, not a STIX/TAXII shape declared by Securonix's own API contract.
- id: ocsf
  name: Open Cybersecurity Schema Framework
  conforms: partial
  declared_in_contract: false
  evidence: >-
    OCSF appears only as an inbound log format Securonix can parse (Amazon Security Lake
    CloudTrail logs in OCSF format connector). Securonix's own APIs return a vendor data
    dictionary, not OCSF-shaped events.
- id: cef-leef-syslog
  name: CEF / LEEF / Syslog
  conforms: true
  declared_in_contract: false
  evidence: >-
    Several hundred documented activity-import connectors accept CEF, LEEF, Syslog key-value
    and Syslog JSON, and the Datasource Onboarding API has first-class syslog source/filter
    operations (configuresyslogdatasource, createsyslogsource, createsyslogfilter).
- id: sigma
  name: Sigma detection rules
  conforms: true
  declared_in_contract: false
  evidence: >-
    Securonix publishes first-party Sigma conversion tooling in its own GitHub organization —
    github.com/Securonix/sigma2snypr and github.com/Securonix/SigmaToSecuronix — so detections
    authored in Sigma can be carried onto the platform.
