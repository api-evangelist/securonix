        > - To receive a YAML response, include the header parameter `Accept: application/yaml` or `Accept: application/x-yaml` in the request.

        > - YAML format is supported only for **IEE (Individual Event Event)** and **AEE (Aggregated Event Event)** policies.

        > - For all other policy types, or if YAML conversion is not supported, the response defaults to JSON format.'
      operationId: getPolicy
      parameters:
      - $ref: '#/components/parameters/ClientIdHeader'
