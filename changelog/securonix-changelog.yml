  additions:
  - >-
    New Data Source Onboarding experience (Early Access) — redesigned discover/configure/manage
    flow for data sources, gated behind the Early Access program and not enabled by default.
  highlights:
  - Threat Coverage Analyzer refreshed with license-aware guidance and clearer policy deployment.
  - Billing dashboard now shows both billed and consumed GB/day in the usage chart.
  - SOAR playbook builder gains block types, copy/paste, resizing, selective execution and file upload.
  - Kafka connector adds SASL PLAIN, Kerberos and .p12 certificate support.
  - Azure Storage connector adds Azure VNet Flow Logs and JSON array log formats.
  - Third Party Intelligence import service gains configurable retention with an audit record per purge.
  - Regex engine used by Job 1 replaced to speed regex-based event parsing.
  - User Import gains smarter field-mapping recommendations and merge guidance.
