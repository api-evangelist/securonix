    ActivelistConfig:
      type: object
      title: ActivelistConfig
      properties:
        rule:
          type: string
          description: "Specifies which mapped attributes should be concatenated to form the key that will be matched against entries in the Lookup Table.\n\n**Usage:**\n- A single mapped attribute can be used directly.\n- Multiple mapped attributes can be concatenated with the `+` operator.\n- Literal strings or symbols can also be inserted into the concatenation by wrapping them in parentheses.\n\n**Concatenation rules:**\n- `attribute1 + attribute2` — joins values of both attributes.\n- `attribute(length)` — takes only the first *length* characters of the attribute.\n- `attribute(start,end)` — takes a substring from position *start* to *end* (1-based indexing).\n- `(literal)` — inserts a literal string or character between attributes.\n\n**Examples:**\n1. **Concatenate two attributes**\n    ```yaml\n    accountname+ipaddress\n    ```\n    Produces a key formed by joining `accountname` and `ipaddress`.\n\n2. **Attribute with substring limit**\n    ```yaml\n    transactionstring1(50)+accountname(1,3)\n    ```\n    Produces a key using:\n    - First 50 characters of `transactionstring1`\n    - First 3 characters of `accountname`\n\n3. **Insert literal between attributes**\n    ```yaml\n    emailsender+(.)+filename\n    ```\n    Produces a key formed by:\n    - Value of `emailsender`\n    - The literal `.`\n    - Value of `filename`"
        rule_match_present:
          type: boolean
          description: Check if the values matching rule provided is present.
          default: true
        activelist_name:
          type: string
          description: Name of the activelist.
      required:
      - rule
      - activelist_name
      examples:
      - rule: ipaddress
        rule_match_present: true
        activelist_name: Password_spraying_attempts_From_single_IP
    AddToWatchlist:
      type: object
      properties:
        watchlist_name:
          type: string
          description: Watchlist name
        removal_period:
          $ref: '#/components/schemas/RemovalPeriod'
          description: Time period after which the violator is removed from the watchlist.
      required:
      - watchlist_name
      - removal_period
      examples:
      - watchlist_name: Domain_Admin
        removal_period:
