openapi: 3.2.0
info:
  title: Datasource Onboarding Job Management API
  description: Allows users to fetch data to create, edit, and onboard a datasource through the API.
  contact:
    name: Securonix
    url: www.securonix.com
  license:
    name: License of API
  version: 1.0.0
servers:
- description: SwaggerHub API Auto Mocking
  url: https://virtserver.swaggerhub.com/securonix-b7a/Datasource_Onboarding/1.0.0
- url: http://localhost:8191
  description: Inferred Url
tags:
- name: Job Management
  description: Manage Datasource Jobs Controller
paths:
  /ingestion/v1/getjobimportsummary:
    get:
      tags:
      - Job Management
      summary: Get a job import summary based on the given input noOfHour
      operationId: getJobImportSummaryUsingGET
      parameters:
      - name: customerId
        in: query
        description: customerId
        required: true
        style: form
        schema:
          type: string
      - name: noOfHours
        in: query
        description: noOfHours
        required: true
        style: form
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HoursJobResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
  /ingestion/v1/listactivityimportjobtriggerdetails:
    get:
      tags:
      - Job Management
      summary: List of all activity import job trigger details by resource group id
      operationId: getAllActivityImportJobDetailsUsingGET
      parameters:
      - name: resourceGroupId
        in: query
        description: resourceGroupId
        required: true
        style: form
        schema:
          type: integer
          format: int64
      - name: customerId
        in: query
        description: customerId
        required: true
        style: form
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AllImportTriggersResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
  /ingestion/v1/fetchrunningjobs:
    get:
      tags:
      - Job Management
      summary: Fetch the running jobs by rgId
      operationId: getRunningJobsForRgUsingGET
      parameters:
      - name: rgId
        in: query
        description: rgId
        required: true
        style: form
        schema:
          type: integer
          format: int64
      - name: customerId
        in: query
        description: customerId
        required: true
        style: form
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InProgressJobsResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
  /ingestion/v1/jobrescheduler:
    post:
      tags:
      - Job Management
      summary: Reschedule the stopped job
      operationId: jobReschedulerUsingPOST
      parameters:
      - name: customerId
        in: query
        description: customerId
        required: true
        style: form
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobReschedulerPayload'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResponseEntity'
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
  /ingestion/v1/stoprunningjob:
    put:
      tags:
      - Job Management
      summary: Stop the running job by jobName
      operationId: stopARunningJobUsingPUT
      parameters:
      - name: jobName
        in: query
        description: jobName
        required: true
        style: form
        schema:
          type: string
      - name: customerId
        in: query
        description: customerId
        required: true
        style: form
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
components:
  schemas:
    ResponseEntity:
      title: ResponseEntity
      type: object
      properties:
        body:
          type: object
        statusCode:
          type: string
          enum:
          - ACCEPTED
          - ALREADY_REPORTED
          - BAD_GATEWAY
          - BAD_REQUEST
          - BANDWIDTH_LIMIT_EXCEEDED
          - CHECKPOINT
          - CONFLICT
          - CONTINUE
          - CREATED
          - DESTINATION_LOCKED
          - EXPECTATION_FAILED
          - FAILED_DEPENDENCY
          - FORBIDDEN
          - FOUND
          - GATEWAY_TIMEOUT
          - GONE
          - HTTP_VERSION_NOT_SUPPORTED
          - IM_USED
          - INSUFFICIENT_SPACE_ON_RESOURCE
          - INSUFFICIENT_STORAGE
          - INTERNAL_SERVER_ERROR
          - I_AM_A_TEAPOT
          - LENGTH_REQUIRED
          - LOCKED
          - LOOP_DETECTED
          - METHOD_FAILURE
          - METHOD_NOT_ALLOWED
          - MOVED_PERMANENTLY
          - MOVED_TEMPORARILY
          - MULTIPLE_CHOICES
          - MULTI_STATUS
          - NETWORK_AUTHENTICATION_REQUIRED
          - NON_AUTHORITATIVE_INFORMATION
          - NOT_ACCEPTABLE
          - NOT_EXTENDED
          - NOT_FOUND
          - NOT_IMPLEMENTED
          - NOT_MODIFIED
          - NO_CONTENT
          - OK
          - PARTIAL_CONTENT
          - PAYLOAD_TOO_LARGE
          - PAYMENT_REQUIRED
          - PERMANENT_REDIRECT
          - PRECONDITION_FAILED
          - PRECONDITION_REQUIRED
          - PROCESSING
          - PROXY_AUTHENTICATION_REQUIRED
          - REQUESTED_RANGE_NOT_SATISFIABLE
          - REQUEST_ENTITY_TOO_LARGE
          - REQUEST_HEADER_FIELDS_TOO_LARGE
          - REQUEST_TIMEOUT
          - REQUEST_URI_TOO_LONG
          - RESET_CONTENT
          - SEE_OTHER
          - SERVICE_UNAVAILABLE
          - SWITCHING_PROTOCOLS
          - TEMPORARY_REDIRECT
          - TOO_EARLY
          - TOO_MANY_REQUESTS
          - UNAUTHORIZED
          - UNAVAILABLE_FOR_LEGAL_REASONS
          - UNPROCESSABLE_ENTITY
          - UNSUPPORTED_MEDIA_TYPE
          - UPGRADE_REQUIRED
          - URI_TOO_LONG
          - USE_PROXY
          - VARIANT_ALSO_NEGOTIATES
        statusCodeValue:
          type: integer
          format: int32
    InProgressJobsResponse:
      title: InProgressJobsResponse
      type: object
      properties:
        connectionType:
          type: string
        createdBy:
          type: integer
          format: int64
        endTime:
          type: string
          format: date-time
        lastStartTime:
          type: string
          format: date-time
        nextFireTime:
          type: string
          format: date-time
        resourceGroupId:
          type: integer
          format: int64
        startTime:
          type: string
          format: date-time
        status:
          type: string
        tenantId:
          type: integer
          format: int64
        triggerName:
          type: string
    AllImportTriggersResponse:
      title: AllImportTriggersResponse
      type: object
      properties:
        importTriggers:
          type: array
          items:
            $ref: '#/components/schemas/AllImportTriggerDetails'
    AllImportTriggerDetails:
      title: AllImportTriggerDetails
      type: object
      properties:
        duration:
          type: string
        eventsPulledDuringTrigger:
          type: string
        jobid:
          type: integer
          format: int64
        resourcegroupID:
          type: string
        resourcegroupname:
          type: string
        status:
          type: string
        triggerEndTime:
          type: string
        triggerStartTime:
          type: string
    HoursJobResponse:
      title: HoursJobResponse
      type: object
      properties:
        connectionType:
          type: string
        createdBy:
          type: integer
          format: int64
        endTime:
          type: string
          format: date-time
        lastStartTime:
          type: string
          format: date-time
        nextFireTime:
          type: string
          format: date-time
        resourceGroupId:
          type: integer
          format: int64
        startTime:
          type: string
          format: date-time
        status:
          type: string
        tenantId:
          type: integer
          format: int64
        triggerName:
          type: string
    JobReschedulerPayload:
      title: JobReschedulerPayload
      type: object
      properties:
        crpId:
          type: integer
          format: int64
        importScheduleJob:
          type: string
        ingesterIdList:
          type: array
          items:
            type: integer
            format: int64
        interval:
          type: integer
          format: int32
        jobRepeatCount:
          type: string
        resourceGroupId:
          type: integer
          format: int64
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: wstoken
