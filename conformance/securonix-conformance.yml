standards:
- id: oauth2
  conforms: true
  evidence: >-
    ThreatQ API declares an OAuth2 password-grant token endpoint (POST /token, grant_type=password,
    client_id) issuing a bearer access_token used as `Authorization: Bearer <access_token>`
    (openapi/securonix-threatq-api.json #/paths/~1token and components.securitySchemes.BearerAuth).
    Separately, www.securonix.com serves RFC 8414 authorization-server metadata with
    authorization_code + refresh_token grants and PKCE S256 for its MCP surface
    (well-known/securonix-oauth-authorization-server.json).
- id: rfc8414
  conforms: true
  evidence: >-
    https://www.securonix.com/.well-known/oauth-authorization-server returns 200 with issuer,
    authorization_endpoint, token_endpoint, revocation_endpoint, response_types_supported,
    grant_types_supported, code_challenge_methods_supported and scopes_supported.
- id: rfc9728
  conforms: true
  evidence: >-
    https://www.securonix.com/.well-known/oauth-protected-resource returns 200 with resource,
    authorization_servers, bearer_methods_supported and scopes_supported.
- id: jwt
  conforms: true
  evidence: >-
    Policy Management API bearerAuth is bearerFormat JWT; the JWT is minted from a WS token at
    POST {REGION_BASE_URL}/shared/snypr-service-gateway/api/v2/oauth/token and carries `role` and
    `tenant` claims used for authorization
    (openapi/securonix-policy-management-api.json #/components/securitySchemes/bearerAuth).
- id: oidc
  conforms: false
  evidence: >-
    No /.well-known/openid-configuration is served on any Securonix host (404 on
    www.securonix.com; catch-all shell on documentation.securonix.com).
- id: rfc9457
  conforms: false
  evidence: >-
    All 53 documented 4xx/5xx responses across the four specs use application/json with a
    vendor ErrorResponse schema; no application/problem+json media type appears in any spec.
- id: pagination
  conforms: true
  evidence: >-
    Consistent offset/max (or offset/limit) pagination across the surface — DevicesRequest.max
    and .offset in openapi/securonix-device-monitoring-api.json, offset/limit on the Spotter
    results endpoint, and offset/max on /ws/incident/get and the Security Command Center widgets.
- id: idempotency
