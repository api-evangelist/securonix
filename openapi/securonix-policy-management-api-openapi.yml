    CheckAgainstTpiAdditionalEventAnalyticsDelta:
      type: object
      description: TPI check analytics configuration
      properties:
        tpi:
          type: 'null'
          description: Indicates the beginning of a TPI configuration block. Can be null.
        additional_criteria:
          $ref: '#/components/schemas/AdditionalCriteria'
          description: "Used to filter results based on one or more selection blocks and a condition.\n\n**Structure:**\n- Must contain **at least one** selection key (`selection_n`, where n ≥ 1)  \n- Must contain a `condition` key  \n- Selection keys may contain **either**:\n  * A **list** of entries → conditions are joined with **OR**.\n    Example:\n    ```yaml\n    selection_1:\n      - tpi_country: USA\n      - tpi_src_confidence|gt: 5\n    ```\n    Evaluates as:\n    ```scss\n    tpi_country(equals)USA OR tpi_src_confidence(greater_than)5\n    ```\n  * A **map** of entries → conditions are joined with **AND**\n    Example:\n    ```yaml\n    selection_1:\n      tpi_country|equals|attr: country\n      tpi_src_confidence|gt: 5\n    ```\n    Evaluates as:\n    ```scss\n    tpi_country(equals)country AND tpi_src_confidence(greater_than)5\n    ```\n**Entry format:**\nTPI_field[|modifier][|attr]: value\n\n- **TPI_field** — the name of the TPI field to filter on  \n- **modifier** *(optional)* — comparison/matching operation. Defaults to `equals` if omitted.\n- **attr** *(optional)* — indicates the value is taken from another attribute rather than a literal.  \n\n**Supported modifiers:**\n1. `equals` *(default if omitted)*\n2. `contains`\n3. `gt` — greater than\n4. `gte` — greater than or equal\n5. `lt` — less than\n6. `lte` — less than or equal\n7. `startswith`\n8. `endswith`\n9. `isnull`\n\n**Negation modifiers:**\n1. `not equals`\n2. `not contains`\n3. `is not null`\n\n**Negation usage:**  \nTo apply negation to an entire selection block, prefix the selection key with `NOT` in `condition`.  \nExample:\n```yaml\nselection_1:\n  tpi_country|equals|attr: USA\ncondition: NOT selection_1\n```\n\nAccepted examples:\n\n- Selection with only `attr`\n  ```yaml\n  selection_1:\n    tpi_country|attr: country\n  ```\n  Evaluates as:\n  ```scss\n  tpi_country(EQUALS)attr.country\n  ```\n- Selection with `modifier` and `attr`\n  ```yaml\n  selection_1:\n    tpi_country|contains|attr: country\n  ```\n  Evaluates as:\n  ```scss\n  tpi_country(CONTAINS)attr.country\n  ```\n- Selection with only `modifier`\n  ```yaml\n  selection_1:\n    tpi_src_confidence|gt: 5\n  ```\n  Evaluates as:\n  ```scss\n  tpi_src_confidence(GREATER_THAN)5\n  ```\n- Selection with negation `modifier` \n  ```yaml\n  selection_1:\n    tpi_country|contains: USA\n  condition: NOT selection_1\n  ```   \n  Evaluates as:\n  ```scss\n  tpi_country(NOT_CONTAINS)USA\n  ```\n\n\n\n\n\n"
      patternProperties:
        (?!tpi|additional_criteria$)^[a-zA-Z_][a-zA-Z0-9_]*$:
          type: array
          description: Dynamic attribute name mapped to a list of TPI names to check against
          items:
            type: string
      required:
      - tpi
      examples:
      - tpi: null
        destinationaddress:
        - SNXTIS_BASIC_IPV4
        - SNXTIS_BASIC_IPV6
        additional_criteria:
          selection_1:
          - tpi_src_confidence|gt: 5
          - tpi_country|contains|attr: country
          selection_2:
          - tpi_src: abc
          condition: selection_1 AND NOT selection_2
      x-internal: true
    LookupAdditionalEventAnalyticsDelta:
      type: object
      description: Defines additional event analytics to check individual events against lookup.
      properties:
        lookup:
          type: object
          description: "Defines lookup-based filtering rules. \n\nThe `lookup` object is a dictionary where:\n- **Key:** `eventAttribute[|modifier]`\n- **Value:** `LookupTableName`\n\n**Supported modifiers:**\n- `equals`\n- `contains`\n- `startswith`\n- `endswith`\n\n*(If no modifier is provided, defaults to `equals`)*\n\n**Operator notes:**\n- List-based operators are **not supported** here.\n- To evaluate as a positive condition, set `condition: lookup`.\n- To evaluate as a negation, set `condition: NOT lookup`.\n\n**Evaluation examples:**\n\n1. **Default equals**\n    ```yaml\n    lookup:\n      accountname: MultipleFailedEntries\n    condition: lookup\n    ```\n    Evaluates as:\n    ```\n    accountname(EQUALS)MultipleFailedEntries\n    ```\n\n2. **Contains**\n    ```yaml\n    lookup:\n      accountname|contains: MultipleFailedEntries\n    condition: lookup\n    ```\n    Evaluates as:\n    ```\n    accountname(CONTAINS)MultipleFailedEntries\n    ```\n\n3. **Negation with contains**\n    ```yaml\n    lookup:\n      accountname|contains: MultipleFailedEntries\n    condition: NOT lookup\n    ```\n    Evaluates as:\n    ```\n    accountname(NOT_CONTAINS)MultipleFailedEntries\n    ```"
          additionalProperties:
            type: string
          minProperties: 1
          maxProperties: 1
        condition:
          type: string
          description: 'Lookup condition.

            '
        additional_criteria:
          $ref: '#/components/schemas/AdditionalCriteria'
          description: "Used to filter results based on one or more selection blocks and a condition.\n\n**Structure:**\n- Must contain **at least one** selection key (`selection_n`, where n ≥ 1)  \n- Must contain a `condition` key  \n- Selection keys may contain **either**:\n  * A **list** of entries → conditions are joined with **OR**.\n    Example:\n    ```yaml\n    selection_1:\n      - sourceaddressregion|contains: NonBusinessDomains\n      - destinationaddressregion|gt: NonBusinessDomains\n      - rg_category|isnull: \n    ```\n    Evaluates as:\n    ```scss\n    sourceaddressregion(contains)NonBusinessDomains OR destinationaddressregion(GREATER_THAN)NonBusinessDomains OR rg_category(IS_NULL)\n    ```\n  * A **map** of entries → conditions are joined with **AND**\n    Example:\n    ```yaml\n    selection_1:\n      VendorId: Vendor\n      sourceaddressregion|startswith: abc\n    ```\n    Evaluates as:\n    ```scss\n    VendorId(equals)Vendor AND sourceaddressregion(STARTS_WUTH)abc\n    ```\n**Entry format:**\nfield[|modifier]: lookup fields\n\n- **field** — the name of the field to filter on  \n- **modifier** *(optional)* — comparison/matching operation. Defaults to `equals` if omitted.\n- **lookup fields** — the lookup fields mapped when configuring the lookup in the UDS platform.  \n\n**Supported modifiers:**\n1. `equals` *(default if omitted)*\n2. `contains`\n3. `gt` — greater than\n4. `gte` — greater than or equal\n5. `lt` — less than\n6. `lte` — less than or equal\n7. `startswith`\n8. `endswith`\n9. `isnull`\n\n**Negation modifiers:**\n1. `not equals`\n2. `not contains`\n3. `is not null`\n\n**Negation usage:**  \nTo apply negation to an entire selection block, prefix the selection key with `NOT` in `condition`.  \nExample:\n```yaml\nselection_1:\n  VendorId|equals: vendor\ncondition: NOT selection_1\n```\nEvaluates as:\n```scss\nVendorId(NOT_EQUALS)vendor\n```\n\nAccepted examples:\n\n- Selection with default `modifier`\n  ```yaml\n  selection_1:\n    VendorId: vendor\n  ```\n  Evaluates as:\n  ```scss\n  VendorId(EQUALS)vendor\n  ```\n- Selection with `modifier`\n  ```yaml\n  selection_1:\n    category|contains: categoryObject\n  ```\n  Evaluates as:\n  ```scss\n  category(CONTAINS)categoryObject\n  ```\n- Selection with negation `modifier` \n  ```yaml\n  selection_1:\n    VendorId|equals: vendor\n  condition: NOT selection_1\n  ```   \n  Evaluates as:\n  ```scss\n  VendorId(NOT_EQUALS)vendor\n  ```"
      required:
      - lookup
      - condition
      examples:
      - lookup:
          accountname: MultipleFailedEntries
        condition: lookup
        additional_criteria:
          selection_1:
            VendorId|contains: Vendor
          condition: NOT selection_1
      x-internal: true
