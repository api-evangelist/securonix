  /v1/policies/all:
    get:
      tags:
      - Policy Management
      summary: Fetch all policies with pagination, sorting, column selection, and dynamic filtering
      description: 'Retrieves a paginated list of policies with support for:


        - **Column Selection**: Return only specific fields.

        - **Sorting**: Order results by supported attributes.

        - **Dynamic Filtering**: Apply flexible filters on any supported field.

        - **Pagination**: Control page size and navigate results.


        This endpoint provides fine-grained control over policy data retrieval.


        > To receive a YAML response, include the header parameter `Accept: application/yaml` or `Accept: application/x-yaml` in the request.

        > If not specified, the response defaults to JSON format.


        > **YAML Response Limitations:**

        > - YAML responses are supported only for **IEE (Individual Event Event)** and **AEE (Aggregated Event Event)** policies.

        > - When YAML format is requested, the response may contain a **partial set of matching policies**. Policies that cannot be converted to YAML are omitted from the response.

        > - When using the `columns` parameter with YAML format, **all mandatory policy fields** must be included to produce a valid YAML response.'
      operationId: getPolicies
      parameters:
      - $ref: '#/components/parameters/ClientIdHeader'
      - name: columns
        in: query
        description: 'Comma-separated list of fields to include in the response. If omitted, all fields are returned.


          **Supported Fields:**

          `id`, `name`, `description`, `isWatchlist`, `targetWorkflow`, `createdOn`, `lastUpdated`, `riskTypeId`, `criticality`, `createdBy`, `updatedBy`, `violator`, `violatorAttribute`, `violation`, `owner`, `remediator`, `hql`, `groupBy`, `havingClause`, `joinGroup`, `initiateWorkFlow`, `directHql`, `category`, `categoryId`, `sandboxCategory`, `notification`, `emailTemplateId`, `realTimeCheck`, `riskThreatId`, `threatName`, `maxResults`, `policyType`, `resourceGroupId`, `outputDatabase`, `clearScratch`, `baseValue`, `directiveEnabled`, `directiveConfig`, `configWorkflowName`, `aggregateScore`, `functionEnabled`, `functionConfig`, `operatorConfig`, `suspectConfig`, `suspectChecksListId`, `resourceType`, `resourceTypeId`, `functionality`, `functionalityId`, `signatureId`, `violatorCriticalityLevel`, `functionSuspectConfigEnabled`, `riskBoosterEnabled`, `riskBoosterConfig`, `hashcode`, `uniqueCode`, `secVersion`, `ownership`, `pipelineName`, `violationDisplayConfig`, `enabled`, `query`, `verboseInfoTemplate`, `analyticsType`, `spConfigSummarizationId`, `feedback`, `analyzerConfig`, `dailyViolationThreshold`, `threatRemediationSteps`, `savePveAndScore`, `analyticConfig`, `saveAsThreat`, `generateNewCasePerRun`, `deleteData`, `actionPrediction`, `cappedRiskScore`, `constantScore`, `customScore`, `commitPolicy`, `additionalInfo`, `releaseNotes`, `whatsNew`, `valid`, `origin`, `modifiedOrigin`.'
        required: false
        schema:
          type: array
          examples:
          - - id
            - name
            - enabled
          items:
            type: string
      - name: sortBy
        in: query
        description: Field to sort results by. Must be one of the supported policy fields.
        required: false
        schema:
          type: string
          default: id
          examples:
          - name
      - name: sortOrder
        in: query
        description: Sort direction. Either `asc` (ascending) or `desc` (descending).
        required: false
        schema:
          type: string
          default: asc
          examples:
          - asc
      - name: limit
        in: query
        description: Maximum number of items per page (1–100).
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
          examples:
          - 50
      - name: page
        in: query
        description: Zero-based page index.
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
          examples:
          - 2
      - name: filters
        in: query
        description: "Dynamic filters passed as **top-level query parameters** (no prefix). \n\nTwo forms are supported:\n\n1) **Equality:** `field=value`\n2) **Operator form:** `field_op=value` where `op` ∈ `like`, `ne`, `gt`, `lt`, `gte`, `lte`, `in`, `between`\n\n**Notes:**\n\n- `in` accepts comma-separated lists.\n- `between` expects two comma-separated values.\n- Supported fields are the same as those in the `columns` parameter, plus `labelName` and `tenantName`."
        style: form
        explode: true
        schema:
          type: string
        examples:
          basic:
            summary: Exact match filter (boolean equality)
            value: ?enabled=true
          like:
            summary: Fuzzy match filter using partial text search
            value: ?name_like=login
          range:
            summary: Range filter for values between a start and end boundary
            value: ?createdOn_between=2024-01-01,2024-06-01
          in:
            summary: Multi-value filter matching any value from a list
            value: ?criticality_in=Low,High,Medium
          multi:
            summary: Combined filters using multiple query parameters
            value: ?enabled=true&name_like=login&criticality=High
      - $ref: '#/components/parameters/AcceptHeader'
      responses:
        '200':
          description: Policies fetched successfully
          headers:
            X-Response-Partial:
              description: Indicates partial YAML conversion when some policies cannot be converted. Value is 'true' when present.
              schema:
                type: string
                example: 'true'
            X-Yaml-Conversion-Unsupported-Count:
              description: Number of policies that could not be converted to YAML format. Only present when X-Response-Partial is true.
              schema:
                type: string
                example: '2'
            Warning:
              description: 'Warning message when partial YAML conversion occurs. Format: ''299 - Partial YAML conversion: some policy types are not supported'''
              schema:
                type: string
                example: '299 - Partial YAML conversion: some policy types are not supported'
            X-Response-Format-Fallback:
              description: Indicates that the response format was changed from the requested format. Value is 'json' when YAML conversion fails and falls back to JSON (e.g., when mandatory columns are missing or conversion error occurs).
              schema:
                type: string
                example: json
            X-Response-Format-Requested:
              description: Indicates the originally requested response format.
              schema:
                type: string
                example: yaml
            X-Yaml-Conversion-Fallback-Reason:
              description: Indicates the specific reason for YAML to JSON fallback. Value is 'missing-mandatory-fields' when the columns parameter is missing required fields for YAML conversion. Only present when X-Response-Format-Fallback is 'json'.
