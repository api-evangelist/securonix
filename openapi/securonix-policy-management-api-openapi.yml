        criticality: Low
        violator: Activityip
        tenantname:
        - string
        signatureid: CAAL-Delta-1
        threatname: Account Manipulation
        saveasthreat: true
        verbose_info: '''Account ${accountname!"UNKNOWN"} getting updates from possible suspicious IP Address.'''
        violation_summary:
          grouping_attribute: DeviceAction
