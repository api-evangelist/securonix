openapi: 3.2.0
info:
  title: ThreatQ Notes API
  description: '© 2025


    The API doc you are viewing is a BETA version that provides an early look at ThreatQ’s new API documentation format.'
  license:
    name: null
    url: null
  version: 1.0.0
  x-logo:
    url: null
    backgroundColor: null
    altText: ThreatQuotient
servers:
- description: SwaggerHub API Auto Mocking
  url: https://virtserver.swaggerhub.com/securonix-b7a/ThreatQ/1.0.0
- url: https://threatq.com/api
  description: ThreatQ Server
security:
- BearerAuth: []
tags:
- name: Notes
paths:
  /note:
    get:
      tags:
      - Notes
      summary: List Notes
      parameters:
      - $ref: '#/components/parameters/CommonObjectWith'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Request Successful
          content:
            application/json:
              schema:
                allOf:
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Notes'
                  type: object
                - $ref: '#/components/schemas/TotalResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-visibility: public
      operationId: getNote
      x-operation-id-source: derived
    post:
      tags:
      - Notes
      summary: Create a(n) Notes
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                allOf:
                - properties:
                    attributes:
                      type: array
                      items:
                        $ref: '#/components/schemas/AttributeBasics'
                    sources:
                      type: array
                      items:
                        $ref: '#/components/schemas/SourceBasics'
                  type: object
                - $ref: '#/components/schemas/NotesFillable'
      responses:
        '200':
          description: Request Successful
          content:
            application/json:
              schema:
                allOf:
                - properties:
                    data:
                      type: array
                      items:
                        allOf:
                        - properties:
                            attributes:
                              type: array
                              items:
                                $ref: '#/components/schemas/AttributeBasics'
                            sources:
                              type: array
                              items:
                                $ref: '#/components/schemas/SourceBasics'
                          type: object
                        - $ref: '#/components/schemas/Notes'
                  type: object
                - $ref: '#/components/schemas/TotalResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-visibility: public
      operationId: postNote
      x-operation-id-source: derived
  /note/consume:
    post:
      tags:
      - Notes
      summary: Notes Consume
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                allOf:
                - properties:
                    note:
                      description: Related Notes
                      type: array
                      items:
                        $ref: '#/components/schemas/NotesFillable'
                  type: object
                - $ref: '#/components/schemas/NotesFillable'
                - $ref: '#/components/schemas/CommonObjectConsumeRequest'
      responses:
        '201':
          description: Ingestion Completed Successfully
          content:
            application/json:
              schema:
                allOf:
                - properties:
                    data:
                      type: array
                      items:
                        allOf:
                        - properties:
                            id:
                              description: Notes ID
                              type: integer
                              default: 1
                          type: object
                        - $ref: '#/components/schemas/NotesFillable'
                  type: object
                - $ref: '#/components/schemas/TotalResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-visibility: public
      operationId: postNoteConsume
      x-operation-id-source: derived
  /note/{note_id}:
    get:
      tags:
      - Notes
      summary: Get Single Notes
      parameters:
      - $ref: '#/components/parameters/NotesId'
      - $ref: '#/components/parameters/CommonObjectWith'
      responses:
        '200':
          description: Request Successful
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/Notes'
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-visibility: public
      operationId: getNoteByNoteId
      x-operation-id-source: derived
    put:
      tags:
      - Notes
      summary: Update a(n) Notes
      parameters:
      - $ref: '#/components/parameters/NotesId'
      - $ref: '#/components/parameters/CommonObjectWith'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                allOf:
                - properties:
                    attributes:
                      type: array
                      items:
                        $ref: '#/components/schemas/AttributeBasics'
                    sources:
                      type: array
                      items:
                        $ref: '#/components/schemas/SourceBasics'
                  type: object
                - $ref: '#/components/schemas/NotesFillable'
      responses:
        '200':
          description: Request Successful
          content:
            application/json:
              schema:
                allOf:
                - properties:
                    data:
                      type: array
                      items:
                        allOf:
                        - properties:
                            attributes:
                              type: array
                              items:
                                $ref: '#/components/schemas/AttributeBasics'
                            sources:
                              type: array
                              items:
                                $ref: '#/components/schemas/SourceBasics'
                          type: object
                        - $ref: '#/components/schemas/Notes'
                  type: object
                - $ref: '#/components/schemas/TotalResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-visibility: public
      operationId: putNoteByNoteId
      x-operation-id-source: derived
    delete:
      tags:
      - Notes
      summary: Delete Notes
      parameters:
      - $ref: '#/components/parameters/NotesId'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-visibility: public
      operationId: deleteNoteByNoteId
      x-operation-id-source: derived
components:
  responses:
    Unauthorized:
      description: Unauthorized
    NotFound:
      description: Object Not Found
    NoContent:
      description: Object(s) were successfully deleted.
  schemas:
    TotalResponse:
      properties:
        total:
          description: Total Number of Objects Processed
          type: integer
          example: 1
      type: object
    ObjectAttributeValue:
      properties:
        value:
          description: Attribute Value
          type: string
          example: High
      type: object
    AttributeFillable:
      properties:
        name:
          description: Attribute Name
          type: string
          example: Confidence
      type: object
    CommonObjectConsumeRequest:
      properties:
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/AttributeBasics'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceBasics'
        tlp:
          $ref: '#/components/schemas/TLPName'
        <object_code>:
          description: 'Relate objects of other types by providing a list of IDs. Replace the `<object_code>` property key with

            one of the options to relate objects of that type. <br><br> NOTE: Objects must be created separately before IDs can be

            used in request. <br><br>Options include: adversaries, attachments, attack_pattern, campaign, course_of_action, events,

            exploit_target, identity, incident, indicators, intrusion_set, malware, recipient, report, signatures, tool, ttp.'
          type: array
          items:
            type: integer
            example: 2
      type: object
    SourceName:
      properties:
        name:
          description: Source Name
          type: string
          example: ThreatQ
      type: object
    SourceBasics:
      oneOf:
      - allOf:
        - properties:
            tlp_id:
              description: Source TLP ID
              type: integer
              example: 3
          type: object
        - $ref: '#/components/schemas/SourceName'
      - allOf:
        - properties:
            tlp:
              $ref: '#/components/schemas/TLPName'
          type: object
        - $ref: '#/components/schemas/SourceName'
    AttributeBasics:
      allOf:
      - properties:
          sources:
            type: array
            items:
              $ref: '#/components/schemas/SourceBasics'
        type: object
      - $ref: '#/components/schemas/ObjectLinkAttributeFillable'
    TLPName:
      properties:
        name:
          description: TLP Name
          type: string
          example: WHITE
      type: object
    ObjectLinkAttributeFillable:
      allOf:
      - $ref: '#/components/schemas/AttributeFillable'
      - $ref: '#/components/schemas/ObjectAttributeValue'
  parameters:
    Limit:
      name: limit
      in: query
      description: <br>The number of objects included in the response.
      required: false
      style: form
      explode: false
      schema:
        type: integer
        example: 10
    CommonObjectWith:
      name: with
      in: query
      description: '<br>Object Relationships that can be included in the response.<br><br>Options include: adversaries, asset,

        attachments, attack_pattern, attributes, campaign, comments, course_of_action, events, exploit_target, identity,

        incident, indicators, intrusion_set, malware, recipient, report, plugins, pluginActions, signatures, sources, tags,

        tool, ttp, and watchlist.'
      required: false
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          example: adversaries,comments,sources
    Offset:
      name: offset
      in: query
      description: <br>The number of result set records that should be ignored.
      required: false
      style: form
      explode: false
      schema:
        type: integer
        example: 50
    Sort:
      name: sort
      in: query
      description: "<br>Designate the field(s) you want to use to sort the retrieved list. You can prepend each field \n        with a minus sign (-) to reverse the sorting order. This string can be a list of comma-separated values."
      required: false
      style: form
      explode: false
      schema:
        type: string
        example: id,created_at
  securitySchemes:
    BearerAuth:
      type: http
      description: "Once authorized, all subsequent requests must include an `Authorization` header\n with the granted `access_token`. See the OAuth2 Authentication path for more information on how to authorize a User.<br><br>\n Example Header: `Authorization: Bearer <access_token>`"
      name: Authorization
      in: header
      bearerFormat: Bearer `<access_token>`
      scheme: bearer
